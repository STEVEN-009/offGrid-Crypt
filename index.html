<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OffGrid Crypt - Generador Analógico</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --bg-principal: #0a0b0d;
            --bg-tarjeta: #14171c;
            --neon-verde: #00ff88;
            --neon-azul: #0077ff;
            --neon-rojo: #ff3355;
            --texto-muted: #6c7a89;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: var(--bg-principal); 
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-tarjeta);
            min-height: 90vh;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid #222630;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        header h1 {
            font-size: 18px;
            letter-spacing: -0.5px;
            margin: 5px 0;
            color: #ffffff;
        }

        header span {
            font-size: 10px;
            color: var(--texto-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            margin: 10px 0;
            display: inline-block;
            width: 100%;
            text-align: center;
        }
        .status-secure { background-color: rgba(0, 255, 136, 0.1); color: var(--neon-verde); border: 1px solid rgba(0, 255, 136, 0.2); }
        .status-risk { background-color: rgba(255, 51, 85, 0.1); color: var(--neon-rojo); border: 1px solid rgba(255, 51, 85, 0.2); }

        .instrucciones {
            background-color: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 12px;
            font-size: 11px;
            color: #a0aec0;
            text-align: left;
            line-height: 1.4;
            border-left: 3px solid var(--neon-azul);
        }

        .form-group {
            margin: 5px 0;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            background-color: #0d0f12;
            border: 2px solid #222630;
            border-radius: 12px;
            color: #ffffff;
            text-align: center;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-azul);
        }

        /* Lista de requerimientos de contraseña */
        .requisitos-lista {
            text-align: left;
            font-size: 11px;
            margin: 8px 0;
            color: var(--texto-muted);
            list-style: none;
        }
        .requisitos-lista li {
            margin: 3px 0;
            transition: color 0.2s;
        }
        .cumplido { color: var(--neon-verde) !important; }

        #contador {
            font-size: 11px;
            color: var(--texto-muted);
            display: block;
            margin-top: 6px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            justify-content: center; 
            margin: 10px 0; 
        }
        
        .cell { 
            aspect-ratio: 1;
            background-color: #0d0f12; 
            border: 2px solid #222630; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 15px; 
            text-transform: uppercase; 
            cursor: pointer; 
            user-select: none; 
            transition: all 0.15s ease;
        }
        
        @media (max-width: 360px) {
            .cell { font-size: 13px; border-radius: 8px; }
            .app-container { padding: 15px; }
        }

        .cell.selected { 
            background-color: var(--neon-azul); 
            color: #ffffff; 
            border-color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 119, 255, 0.4);
        }
        .cell.procesada {
            border-color: rgba(0, 255, 136, 0.3);
        }

        .actions-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        button { 
            width: 100%;
            padding: 14px; 
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px; 
            font-weight: bold;
            border-radius: 12px; 
            border: none; 
            cursor: pointer;
            transition: all 0.3s;
        }
        button:disabled {
            background-color: #1e2330 !important;
            color: #4a5568 !important;
            cursor: not-allowed;
            box-shadow: none !important;
        }
        .btn-success { background-color: var(--neon-verde); color: #000000; box-shadow: 0 4px 12px rgba(0, 255, 136, 0.2); }
        .btn-danger { background-color: transparent; color: var(--neon-rojo); border: 1px solid rgba(255, 51, 85, 0.3); }

        @media (min-width: 450px) {
            .app-container {
                height: auto;
                min-height: 600px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <span>OffGrid Cryptography</span>
            <h1>Criptofolio Analógico</h1>
            <div id="status-badge" class="status-badge status-risk">Verificando entorno...</div>
        </header>

        <div class="instrucciones">
            <strong>1.</strong> Crea una clave segura.<br>
            <strong>2.</strong> Dibuja tu patrón tocando el mismo número de casillas.
        </div>

        <div class="form-group">
            <input type="text" id="clave" placeholder="CREA TU CLAVE SEGURA" oninput="validarClaveYContadores()">
            
            <ul class="requisitos-lista">
                <li id="req-largo">⚬ Mínimo 6 caracteres</li>
                <li id="req-numero">⚬ Al menos un número (0-9)</li>
                <li id="req-especial">⚬ Al menos un símbolo ($#,!%@)</li>
            </ul>

            <span id="contador">Letras clave: 0 | Patrón: 0</span>
        </div>

        <div class="grid" id="cuadrícula"></div>

        <div class="actions-panel">
            <button id="btn-esconder" class="btn-success" onclick="procesarMatriz()" disabled>Esconder en mi Patrón</button>
            <button class="btn-danger" onclick="limpiarTodo()">Destruir Sesión</button>
        </div>

    </div>

    <script>
        let posicionesSeleccionadas = [];
        let claveEsSegura = false;

        function verificarConexion() {
            const badge = document.getElementById('status-badge');
            if (navigator.onLine) {
                badge.innerText = "⚠️ EN RIESGO: CONECTADO A INTERNET";
                badge.className = "status-badge status-risk";
            } else {
                badge.innerText = "✅ ENTORNO SEGURO: MODO OFFLINE";
                badge.className = "status-badge status-secure";
            }
        }
        window.addEventListener('online', verificarConexion);
        window.addEventListener('offline', verificarConexion);
        verificarConexion();

        function inicializarGrid() {
            const contenedorGrid = document.getElementById('cuadrícula');
            contenedorGrid.innerHTML = "";
            posicionesSeleccionadas = [];
            validarClaveYContadores();

            for (let i = 0; i < 25; i++) {
                const casilla = document.createElement('div');
                casilla.className = 'cell';
                casilla.dataset.index = i;
                casilla.innerText = "•"; 
                
                casilla.addEventListener('click', function() {
                    // Si la clave aún no es segura, no dejamos interactuar con la cuadrícula
                    if (!claveEsSegura) {
                        alert("Socio, primero cumple con los requisitos de la contraseña.");
                        return;
                    }

                    const index = parseInt(this.dataset.index);
                    if (this.classList.contains('selected')) {
                        this.classList.remove('selected');
                        posicionesSeleccionadas = posicionesSeleccionadas.filter(item => item !== index);
                    } else {
                        // Limitar que no seleccionen más casillas que el largo de la clave
                        const largoClave = document.getElementById('clave').value.length;
                        if (posicionesSeleccionadas.length >= largoClave) {
                            alert(`Ya seleccionaste las ${largoClave} casillas de tu patrón.`);
                            return;
                        }
                        this.classList.add('selected');
                        posicionesSeleccionadas.push(index);
                    }
                    validarClaveYContadores();
                });

                contenedorGrid.appendChild(casilla);
            }
        }

        // CONTROLADOR DE SEGURIDAD EN TIEMPO REAL
        function validarClaveYContadores() {
            const claveInput = document.getElementById('clave').value;
            const largoClave = claveInput.length;
            
            // Expresiones regulares para validar números y símbolos
            const tieneNumero = /[0-9]/.test(claveInput);
            const tieneEspecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(claveInput);

            // Validar visualmente la lista de requisitos
            if (largoClave >= 6) document.getElementById('req-largo').className = "cumplido";
            else document.getElementById('req-largo').className = "";

            if (tieneNumero) document.getElementById('req-numero').className = "cumplido";
            else document.getElementById('req-numero').className = "";

            if (tieneEspecial) document.getElementById('req-especial').className = "cumplido";
            else document.getElementById('req-especial').className = "";

            // Comprobar si pasa todo el filtro de seguridad
            claveEsSegura = (largoClave >= 6 && tieneNumero && tieneEspecial);

            const largoPatron = posicionesSeleccionadas.length;
            document.getElementById('contador').innerText = `Letras clave: ${largoClave} | Patrón: ${largoPatron}`;

            // El botón de enviar solo se activa si la clave es segura Y el patrón coincide en longitud
            const btnEsconder = document.getElementById('btn-esconder');
            if (claveEsSegura && largoClave === largoPatron) {
                btnEsconder.disabled = false;
            } else {
                btnEsconder.disabled = true;
            }
        }

        function procesarMatriz() {
            const inputClave = document.getElementById('clave').value.toUpperCase();
            const letrasPosibles = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$@!%";
            const casillas = document.querySelectorAll('.cell');

            casillas.forEach((casilla, i) => {
                casilla.classList.remove('selected'); 
                casilla.classList.add('procesada');
                
                if (posicionesSeleccionadas.includes(i)) {
                    const ordenClic = posicionesSeleccionadas.indexOf(i);
                    casilla.innerText = inputClave[ordenClic];
                    casilla.style.color = "#ffffff";
                } else {
                    const caracterAleatorio = letrasPosibles.charAt(Math.floor(Math.random() * letrasPosibles.length));
                    casilla.innerText = caracterAleatorio;
                    casilla.style.color = "#4a5568";
                }
            });
        }

        function limpiarTodo() {
            document.getElementById('clave').value = "";
            inicializarGrid();
        }
        // --- REGISTRO DE LA PWA (NUEVO) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker activo', reg))
                    .catch(err => console.error('Error al registrar SW', err));
            });
        }

        inicializarGrid();
    </script>
</body>
</html>
